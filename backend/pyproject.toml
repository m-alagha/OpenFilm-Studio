[project]
name = "openfilm-backend"
version = "0.1.0"
description = "OpenFilm Studio local backend"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
]

[project.urls]
Homepage = "https://github.com/m-alagha/OpenFilm-Studio"
Repository = "https://github.com/m-alagha/OpenFilm-Studio"
Issues = "https://github.com/m-alagha/OpenFilm-Studio/issues"
Releases = "https://github.com/m-alagha/OpenFilm-Studio/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx2>=0.1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "S608"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests", "../scripts"]
